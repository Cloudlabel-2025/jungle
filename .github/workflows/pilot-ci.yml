name: Existing app and pilot regression
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:week1
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-build-secret-never-used-for-live-sessions
          DEMO_MODE: 'false'
